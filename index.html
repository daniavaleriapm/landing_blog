<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valeria Peña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Courier+Prime&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="landing">
<div class="stage" id="stage"><div class="canvas" id="canvas">
  <i class="bg bg-top"></i><i class="bg bg-mid"></i><i class="bg bg-bot"></i>
  <main class="content">
    <nav class="nav" aria-label="Secciones">
      <a class="btn" href="#sobre">Sobre mi</a><a class="btn" href="#lenguajes">Lenguajes</a>
      <a class="btn" href="#eventos">Eventos</a><a class="btn" href="#proyectos">Proyectos</a>
    </nav>

    <section id="sobre" class="sec about">
      <img class="deco stars" src="assets/stars.png" alt="">
      <h2 class="tag t-about">Sobre mi</h2>
      <div class="cam"><img class="cam-frame" src="assets/camera.png" alt=""><img class="cam-photo" id="aboutPhoto" alt="Foto de Valeria"></div>
      <div class="paint"><img src="assets/paint.png" alt=""><p id="aboutText"></p></div>
    </section>

    <section id="lenguajes" class="sec langs"><h2 class="tag t-langs">Lenguajes</h2><div id="langList" class="lang-list"></div></section>

    <section id="eventos" class="sec events-sec"><h2 class="tag t-events">Eventos</h2><div id="eventList" class="events"></div></section>

    <section id="proyectos" class="sec projects">
      <h2 class="tag t-proj">Proyectos</h2>
      <div class="carousel">
        <button class="arrow prev" id="prev" aria-label="Proyecto anterior"><img src="assets/flecha-izq.png" alt=""></button>
        <div class="vp"><div class="track" id="track"></div></div>
        <button class="arrow next" id="next" aria-label="Proyecto siguiente"><img src="assets/flecha-der.png" alt=""></button>
      </div>
      <img class="deco lolli" src="assets/lollipop.png" alt="">
    </section>

    <section id="detalle" class="sec panel" hidden>
      <h3 class="tag t-panel" id="pTitle"></h3>
      <div class="shot"><img id="pImg" alt=""></div>
      <p class="ptext" id="pText"></p>
      <img class="pal" id="pPal" alt="Paleta de colores">
    </section>
    <div class="go-blog"><a class="btn" href="blog.html">Blog</a></div>
  </main>
</div></div>
<script src="js/default-data.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
